[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/ads.txt"
  to = "/ads.txt"
  status = 200


[[redirects]]
  from = "https://www.agecalculater.com/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "https://www.agecalculater.com/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

# Optional: explicit 200 on non-www too (harmless/clear)
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# --- Keep SPA fallback LAST ---
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
